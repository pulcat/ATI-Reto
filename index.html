<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATI[UCV]Log 2026-1</title>
  <link rel="icon" sizes="32x32"   href="icon/cropped-logonuevo-32x32.png">
  <link rel="icon" sizes="192x192" href="icon/cropped-logonuevo-192x192.png">
  <style>
    @import "css/_theme.css";

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--primary-font); }

    header {
      background-color: var(--main-color);
      color: var(--white);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--grey-100);
    }

    .logo {
      font-size: 2rem;
      font-weight: bold;
      color: var(--white);
      text-decoration: none;
    }

    .logo span {
      font-size: 1rem;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    nav form {
      display: flex;
      gap: 8px;
    }

    nav input {
      padding: 6px 12px;
      border-radius: 4px;
      border: none;
      font-family: var(--primary-font);
    }

    nav button {
      padding: 6px 16px;
      background: var(--accent-color);
      color: var(--white);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--primary-font);
    }

    .user-icon {
      width: 40px;
      height: 40px;
    }

    section {
      padding: 32px 24px;
    }

    section h2 {
      margin-bottom: 24px;
      font-family: var(--condensed-font);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .student-card {
      border: 1px solid var(--grey-100);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .student-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      object-position: top;
      display: block;
      transition: transform 0.3s;
    }

    .card-footer {
      padding: 8px 12px;
      border-bottom: 4px solid var(--main-color);
      transition: border-color 0.3s;
      font-family: var(--primary-font);
    }

    .student-card:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .student-card:hover .card-footer {
      border-color: var(--accent-color);
    }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 0.85rem;
      color: var(--grey-400);
      border-top: 1px solid var(--grey-100);
      margin-top: 32px;
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html">ATI<span>[UCV]</span>Log</a>
    <nav>
      <form>
        <input type="text" placeholder="Nombre...">
        <button type="button">Buscar</button>
      </form>
    </nav>
    <img class="user-icon" src="icon/userIcon.svg" alt="Usuario">
  </header>

  <section>
    <h2>Semestre 2026-1</h2>
    <div class="grid">

      <a class="student-card" href="30243278/profile.html">
        <img src="30243278/30243278.jpg" alt="María Miranda">
        <div class="card-footer">María Miranda</div>
      </a>

      <div class="student-card">
        <img src="Dummies/dummy1.png" alt="Helena Torres">
        <div class="card-footer">Helena Torres</div>
      </div>

      <div class="student-card">
        <img src="Dummies/dummy2.png" alt="Carlos Blanco">
        <div class="card-footer">Carlos Blanco</div>
      </div>

      <div class="student-card">
        <img src="Dummies/dummy3.png" alt="Juan Gutierrez">
        <div class="card-footer">Juan Gutierrez</div>
      </div>

      <div class="student-card">
        <img src="Dummies/dummy4.png" alt="Isabel Contreras">
        <div class="card-footer">Isabel Contreras</div>
      </div>

      <div class="student-card">
        <img src="Dummies/dummy5.png" alt="Gabriel Vargas">
        <div class="card-footer">Gabriel Vargas</div>
      </div>

    </div>
  </section>

  <footer>
    Copyright © 2026 Escuela de computación - ATI. Todos los derechos reservados
  </footer>

</body>
</html>
